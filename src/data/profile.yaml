# Shown in the "About" section. Markdown is fine.
about: |
  I'm an AI/ML engineer with a full-stack background. Right now I'm building the agent layer
  and the AI interview product at **Hiring Bazaar AI** (part-time), with real-time voice
  interviews on LiveKit. Before that I was the first engineer at **LyteHire AI** and built the
  product from an empty repo: resume parsing with RAG and pgvector, an email agent on Google
  ADK that loops in a human when it should, and a voice interview agent with sub-1.2s
  turn-taking.

  I also take on freelance work: AI agents, voice AI and full-stack products.
  [Hire me](/hire/).

  Outside work I build small, fast native tools for Windows (Rust and C++, no runtimes, a
  few MB each), take apart software I like with reverse-engineering tools to learn how it
  works, and watch a lot of movies. Probably too many.

